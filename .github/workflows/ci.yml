name: CI (iFirma mock)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: pytest & license headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: ifirma-mock
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: ifirma-mock
        run: pytest -q
      - name: Verify MIT license headers
        run: python3 tools/check_license_headers.py
